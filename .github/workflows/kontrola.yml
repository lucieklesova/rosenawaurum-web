# Kontrola, že HTML odpovídá zdrojům (partials/, assets/, translations.js) a že nejsou rozbité odkazy.
name: Kontrola webu

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntaxe JS
        run: node --check assets/js/translations.js && node --check assets/js/main.js

      - name: HTML je sestavené (python3 tools/build.py)
        run: python3 tools/build.py --check

      - name: Interní odkazy a obrázky
        run: python3 tools/check_links.py
