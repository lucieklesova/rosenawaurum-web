# Úpravy článku z mobilu: v PR napiš komentář začínající @codex, např.
# "@codex prohoď první a třetí fotku a v nadpisu oprav Brno na Brně".
name: Codex – úpravy v PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  upravy:
    if: >
      contains(github.event.comment.body, '@codex') &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout větve PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
          fi
          echo "PR=$PR" >> "$GITHUB_ENV"
          gh pr checkout "$PR"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow pillow-heif beautifulsoup4

      - name: Ulož komentář pro Codex
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          mkdir -p _incoming
          python3 -c "from pathlib import Path; import os; Path('_incoming/komentar.md').write_text(os.environ['COMMENT'], encoding='utf-8')"

      - name: Codex upraví článek
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/prompts/upravy.md

      - name: Commit a push
        run: |
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude)_incoming'
          if git diff --cached --quiet; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "Codex v komentáři nenašel žádné změny k uložení."
            exit 0
          fi
          git commit -m "Úpravy podle komentáře (@codex)"
          git push
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Hotovo. Úpravy z \`@codex\` jsou v posledním commitu."
