# Úpravy článku z mobilu: v PR napiš komentář začínající @claude, např.
# "@claude prohoď první a třetí fotku a v nadpisu oprav Brno na Brně".
name: Claude – úpravy v PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  upravy:
    if: >
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif beautifulsoup4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash"
